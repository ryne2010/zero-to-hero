name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate skill/plugin repo
        run: make validate
      - name: Runtime smoke
        run: make smoke
      - name: Archive smoke
        run: make archive-smoke
