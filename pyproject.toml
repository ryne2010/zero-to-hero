[project]
name = "zero-to-hero-skill-repo"
version = "0.1.0"
description = "Codex plugin and skill pack for turning ideas or messy repos into implementation-ready product repos."
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "ruff==0.14.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
